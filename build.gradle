plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	runs {
		client {
			runDir "run/26.2"
		}
	}

	mods {
		"no-hide-flags" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

// Fat-jar assembly. The two legacy variants are separate Gradle builds
// (Loom 1.10 cannot coexist with Loom 1.18 in one build); their remapped,
// intermediary-named outputs are merged here together with the Mojang-named
// modern26 classes. Build them first via build-all.cmd / build-all.sh.
def legacyVariantJars = [
	'variants/legacy121/build/libs/no-hide-flags-legacy121-1.0.0.jar',
	'variants/legacy125/build/libs/no-hide-flags-legacy125-1.0.0.jar'
]

jar {
	inputs.property "archivesName", project.base.archivesName

	// The dev fabric.mod.json only lists the modern26 config (the legacy
	// configs only exist in the fat jar); swap in the fat definition.
	exclude 'fabric.mod.json'
	from('fat') {
		include 'fabric.mod.json.template'
		rename { 'fabric.mod.json' }
		expand "version": project.version
	}
	legacyVariantJars.each { path ->
		from(zipTree(file(path))) {
			include 'indi/**', 'no-hide-flags.legacy*.mixins.json', '*-refmap.json'
		}
	}
	doFirst {
		legacyVariantJars.each { path ->
			if (!file(path).exists()) {
				throw new GradleException(
					"${path} is missing - build the variant projects first (build-all.cmd / build-all.sh)")
			}
		}
	}

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}